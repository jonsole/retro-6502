# ld65 configuration for the boot ROM: the 32 KB image, ROM offsets
# 0x0000-0x7FFF. Pages 0-2 are not used yet (0xFF). Page 3 is seen at
# $E000-$FFFF in window 7 after reset (spec 7, section 4.2); $FE00-$FEFF is
# under the system block there, so nothing goes in it.
MEMORY {
    PAGES02: start = $0000, size = $6000, fill = yes, fillval = $FF, file = %O;
    ROM3:    start = $E000, size = $1E00, fill = yes, fillval = $FF, file = %O;
    HOLE:    start = $FE00, size = $0100, fill = yes, fillval = $FF, file = %O;
    TOP:     start = $FF00, size = $0100, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = ROM3, type = ro;
    RODATA:  load = ROM3, type = ro;
    VECTORS: load = TOP,  type = ro, start = $FFD0;
}
